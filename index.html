<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Coded Life</title>
    <meta
      name="description"
      content="Digital Twin of Coded Life Exhibition"
    />
    <link
      rel="icon"
      type="image/svg+xml" href="assets/img/favicon.svg"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Mono&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,700;1,9..40,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/base.css" />
    <link rel="stylesheet" href="assets/css/obelisk.css" />

    <script type="importmap">
      {
        "imports": {
          "three": "./assets/vendor/three/three.module.min.js",
          "three/addons/controls/OrbitControls.js": "./assets/vendor/three/OrbitControls.js"
        }
      }
    </script>
  </head>
  <body>
    <div class="stage">
      <canvas class="stage__canvas" id="scene"></canvas>
      <div class="stage__status" id="status"><span>Loading<span class="stage__dots" aria-hidden="true"><span>.</span><span>.</span><span>.</span></span></span></div>
    </div>

    <div class="hud">
      <div class="hud__topbar">
        <span class="hud__title">Coded Life</span>
        <button class="hud__about" id="about-open" type="button" aria-label="About Coded Life">
          <span class="hud__about-icon" aria-hidden="true">?</span>
        </button>
      </div>

      <div class="hud__controls">
        <button class="btn btn--icon" id="zoom-in" type="button" aria-label="Zoom in">+</button>
        <button class="btn btn--icon" id="zoom-out" type="button" aria-label="Zoom out">&minus;</button>
        <button class="btn btn--icon" id="reset-view" type="button" aria-label="Reset view">&#8635;</button>
      </div>

      <!-- <p class="hud__hint" id="hint">Tap a QR code to learn about it</p> -->
    </div>

    <dialog class="modal" id="qr-modal" aria-labelledby="qr-modal-title">
      <div class="modal__inner">
        <button class="modal__close" id="qr-modal-close" type="button" aria-label="Close"><svg viewBox="0 0 14 14" aria-hidden="true"><path d="M1 1 13 13M13 1 1 13" /></svg></button>
        <div id="qr-modal-content"></div>
      </div>
    </dialog>

    <dialog class="modal" id="about-modal" aria-labelledby="about-modal-title">
      <div class="modal__inner">
        <button class="modal__close" id="about-modal-close" type="button" aria-label="Close"><svg viewBox="0 0 14 14" aria-hidden="true"><path d="M1 1 13 13M13 1 1 13" /></svg></button>
        <div id="about-modal-content"></div>
      </div>
    </dialog>

    <script type="module" src="assets/js/obelisk/main.js"></script>
  </body>
</html>
