<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>The Obelisk — Coded Life</title>
    <meta
      name="description"
      content="Navigable 3D obelisk. Tap a QR code to open its own page."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 7 7'%3E%3Cpath fill='%23111' d='M0 0h3v3H0zM4 0h3v3H4zM0 4h3v3H0zM4 4h1v1H4zM6 4h1v1H6zM5 5h1v1H5zM4 6h1v1H4zM6 6h1v1H6z'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Mono&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,700;1,9..40,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/base.css" />
    <link rel="stylesheet" href="assets/css/obelisk.css" />

    <script type="importmap">
      {
        "imports": {
          "three": "./assets/vendor/three/three.module.min.js",
          "three/addons/controls/OrbitControls.js": "./assets/vendor/three/OrbitControls.js"
        }
      }
    </script>
  </head>
  <body>
    <div class="stage">
      <canvas class="stage__canvas" id="scene"></canvas>
      <div class="stage__status" id="status">Loading the obelisk…</div>
    </div>

    <div class="hud">
      <div class="hud__topbar">
        <span class="hud__title">Coded Life</span>
      </div>

      <div class="hud__controls">
        <button class="btn btn--icon" id="zoom-in" type="button" aria-label="Zoom in">+</button>
        <button class="btn btn--icon" id="zoom-out" type="button" aria-label="Zoom out">&minus;</button>
        <button class="btn btn--icon" id="reset-view" type="button" aria-label="Reset view">&#8635;</button>
      </div>

      <!-- <p class="hud__hint" id="hint">Tap a QR code to open its page</p> -->
    </div>

    <script type="module" src="assets/js/obelisk/main.js"></script>
  </body>
</html>
